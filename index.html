<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <title>Frontend Mentor | Conference ticket generator</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <picture>
        <source media="(min-width: 1024px)" srcset="./assets/images/background-desktop.png" />
        <source media="(min-width: 768px)" srcset="./assets/images/background-tablet.png" />
        <img
          src="./assets/images/background-mobile.png"
          alt=""
          width="750"
          height="1990"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
    </div>
    <div class="page-bg-lines" aria-hidden="true">
      <img src="./assets/images/pattern-lines.svg" alt="" width="1459" height="1024" />
    </div>
    <div class="page-line-top" aria-hidden="true">
      <img src="./assets/images/pattern-squiggly-line-top.svg" alt="" width="446" height="208" />
    </div>
    <div class="page-line-bottom" aria-hidden="true">
      <picture>
        <source
          media="(min-width: 1024px)"
          srcset="./assets/images/pattern-squiggly-line-bottom-desktop.svg"
        />
        <img
          src="./assets/images/pattern-squiggly-line-bottom-mobile-tablet.svg"
          alt=""
          width="760"
          height="530"
        />
      </picture>
    </div>
    <header class="header">
      <a class="logo" href="/">
        <img src="./assets/images/logo-full.svg" alt="Coding Conf" width="209" height="30" />
      </a>
    </header>
  </body>
</html>
