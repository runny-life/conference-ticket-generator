<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <title>Frontend Mentor | Conference ticket generator</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <picture>
        <source media="(min-width: 1024px)" srcset="./assets/images/background-desktop.png" />
        <source media="(min-width: 768px)" srcset="./assets/images/background-tablet.png" />
        <img
          src="./assets/images/background-mobile.png"
          alt=""
          width="750"
          height="1990"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
    </div>
    <div class="page-bg-lines" aria-hidden="true">
      <img src="./assets/images/pattern-lines.svg" alt="" width="1459" height="1024" />
    </div>
    <div class="page-line-top" aria-hidden="true">
      <img src="./assets/images/pattern-squiggly-line-top.svg" alt="" width="446" height="208" />
    </div>
    <div class="page-line-bottom" aria-hidden="true">
      <picture>
        <source
          media="(min-width: 1024px)"
          srcset="./assets/images/pattern-squiggly-line-bottom-desktop.svg"
        />
        <img
          src="./assets/images/pattern-squiggly-line-bottom-mobile-tablet.svg"
          alt=""
          width="760"
          height="530"
        />
      </picture>
    </div>
    <header class="header">
      <a class="logo" href="/" aria-label="Coding Conf home">
        <img src="./assets/images/logo-full.svg" alt="Coding Conf" width="209" height="30" />
      </a>
    </header>
    <main>
      <section class="form-section" id="form-section" aria-labelledby="form-section-title">
        <div class="form-section__inner">
          <header class="form-section__header">
            <h1 class="form-section__title" id="form-section-title">
              Your Journey to Coding Conf 2025 Starts Here!
            </h1>
            <p class="form-section__description">
              Secure your spot at next year’s biggest coding conference.
            </p>
          </header>

          <form class="form" id="ticket-form" novalidate>
            <fieldset class="field field--avatar">
              <legend class="field__legend">Upload Avatar</legend>
              <label class="dropzone" id="dropzone" aria-describedby="avatar-hint avatar-error">
                <input
                  class="dropzone__input sr-only"
                  type="file"
                  name="avatar"
                  id="avatar"
                  accept="image/png, image/jpeg"
                  aria-describedby="avatar-hint avatar-error"
                />
                <div class="dropzone__empty" id="dropzone-empty">
                  <span class="dropzone__icon" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="30"
                      height="30"
                      fill="none"
                      viewBox="0 0 30 30"
                    >
                      <path
                        fill="#F57463"
                        fill-rule="evenodd"
                        d="M21.894 11.252a.264.264 0 0 1-.229-.225c-.368-2.634-2.51-5.924-6.663-5.924-4.465 0-6.3 3.636-6.657 5.928a.264.264 0 0 1-.228.22c-2.95.362-4.945 2.622-4.945 5.729a5.802 5.802 0 0 0 3.423 5.277 6.274 6.274 0 0 0 2.305.468h2.528a.45.45 0 0 0 .45-.45c0-.267-.233-.472-.5-.484a3.077 3.077 0 0 1-2.049-.9 3.123 3.123 0 0 1 0-4.418l3.461-3.462c.147-.146.307-.277.479-.392.076-.05.158-.085.236-.129.1-.054.196-.114.301-.158.1-.04.206-.065.308-.096.092-.027.181-.062.276-.081.191-.039.384-.056.578-.059.011 0 .022-.004.034-.004.01 0 .018.003.027.004.196.002.391.02.584.059.094.019.18.053.271.08.105.031.211.055.313.098.1.042.193.098.288.15.084.046.17.083.25.137.154.103.295.221.428.349.016.014.034.024.049.039l3.463 3.463a3.124 3.124 0 0 1 0 4.42c-.558.56-1.284.86-2.05.897-.266.013-.497.219-.497.486 0 .249.202.451.451.451h2.512c.435 0 1.314-.06 2.344-.473a5.794 5.794 0 0 0 3.394-5.272c0-3.104-1.991-5.363-4.935-5.728Z"
                        clip-rule="evenodd"
                      />
                      <path
                        fill="#F57463"
                        fill-rule="evenodd"
                        d="M18.464 19.62a.936.936 0 0 0 .663-1.6l-3.464-3.464a.938.938 0 0 0-.664-.275l-.014.002a.932.932 0 0 0-.65.274l-3.462 3.462a.936.936 0 1 0 1.326 1.325l1.864-1.862v6.479a.937.937 0 1 0 1.875 0v-6.48l1.864 1.863a.93.93 0 0 0 .662.275Z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </span>
                  <span class="dropzone__description">Drag and drop or click to upload</span>
                </div>
                <div class="dropzone__output" hidden>
                  <img class="dropzone__preview" id="avatar-preview" src="" alt="" />
                  <div class="dropzone__output-actions">
                    <button class="dropzone__remove" id="avatar-remove" type="button">
                      Remove image
                    </button>
                    <button class="dropzone__change" id="avatar-change" type="button"></button>
                  </div>
                </div>
              </label>
              <p class="field__hint" id="avatar-hint">
                Upload your photo (JPG or PNG, max size: 500KB).
              </p>
              <p class="field__error" id="avatar-error" role="alert" hidden></p>
            </fieldset>

            <fieldset class="field">
              <label class="field__label" for="name">Full Name</label>
              <input
                class="field__input"
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                required
              />
            </fieldset>

            <fieldset class="field">
              <label class="field__label" for="email">Email Address</label>
              <input
                class="field__input"
                id="email"
                type="email"
                name="email"
                autocomplete="email"
                inputmode="email"
                required
                aria-describedby="email-error"
                placeholder="example@email.com"
              />
              <p class="field__error" id="email__error"></p>
            </fieldset>

            <fieldset class="field">
              <label class="field__label" for="github">GitHub Username</label>
              <input
                class="field__input"
                id="github"
                type="text"
                name="github"
                required
                aria-describedby="github-hit github-error"
                placeholder="@yourusername"
              />
              <p class="field__hint sr-only" id="github-hint">
                Your GitHub username, starting with @.
              </p>
              <p id="github-error" class="field__error" role="alert" hidden></p>
            </fieldset>

            <button class="btn btn--primary" id="submit-btn" type="submit">
              Generate My Ticket
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
